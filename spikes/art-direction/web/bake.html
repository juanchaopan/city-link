<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>素材生成器</title>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <script type="module">
      import { Baker } from './kit/bake.js';
      import { palettes } from './kit/palettes.js';
      import { generateCity, keysOf } from './sim/city.js';
      import { generateRoadDemo } from './sim/roaddemo.js';
      import { bakeKey, EXTRA_KEYS } from './kit/catalog.js';

      const baker = new Baker();
      const GUTTER = 2;
      const ATLAS_WIDTH = 4096;

      /** dayOnly 是不含亮窗层的白天图集，只用来量"两套图集"方案的包体。 */
      const paletteOf = (id) =>
        id === 'dayOnly'
          ? { ...palettes.sunny, window: { ...palettes.sunny.window, litRatio: 0, layer: false } }
          : palettes[id];

      function pack(sprites) {
        const sorted = [...sprites].sort((a, b) => b.h - a.h || b.w - a.w);
        let x = GUTTER;
        let y = GUTTER;
        let shelf = 0;
        for (const sprite of sorted) {
          if (x + sprite.w + GUTTER > ATLAS_WIDTH) {
            x = GUTTER;
            y += shelf + GUTTER;
            shelf = 0;
          }
          sprite.x = x;
          sprite.y = y;
          x += sprite.w + GUTTER;
          shelf = Math.max(shelf, sprite.h);
        }
        return y + shelf + GUTTER;
      }

      function draw(sprites, height) {
        const canvas = document.createElement('canvas');
        canvas.width = ATLAS_WIDTH;
        canvas.height = height;
        const context = canvas.getContext('2d');
        const frames = {};
        for (const sprite of sprites) {
          context.putImageData(new ImageData(sprite.data, sprite.w, sprite.h), sprite.x, sprite.y);
          frames[sprite.key] = {
            x: sprite.x,
            y: sprite.y,
            w: sprite.w,
            h: sprite.h,
            ax: sprite.ax,
            ay: sprite.ay,
          };
        }
        return { png: canvas.toDataURL('image/png'), frames };
      }

      window.keysFor = (sizes) => {
        const keys = new Set(EXTRA_KEYS);
        const collect = (city) => {
          for (const key of keysOf(city)) keys.add(key);
        };
        for (const N of sizes) {
          for (const [layout, linked] of [
            ['spread', false],
            ['spread', true],
            ['concentrated', false],
          ])
            collect(generateCity(N, 11, layout, linked));
        }
        collect(generateRoadDemo());
        return [...keys].sort();
      };

      /** keys 进主图集，每个亮窗层单独一帧，和建筑在同一张纹理上，所以绘制时不用换纹理。 */
      window.bakeAtlas = (paletteId, keys) => {
        const palette = paletteOf(paletteId);
        baker.usePalette(palette);
        const groups = {};
        const sprites = [];
        const started = performance.now();
        for (const key of keys) {
          const t0 = performance.now();
          const { spec, result } = bakeKey(baker, key, palette);
          const { glow, ...sprite } = result;
          const ms = performance.now() - t0;
          const entry = (groups[spec.group] ??= { count: 0, ms: 0, pixels: 0 });
          entry.count += 1;
          entry.ms += ms;
          entry.pixels += sprite.w * sprite.h;
          sprites.push({ key, ...sprite });
          if (glow) {
            sprites.push({ key: `${key}~g`, ...glow });
            const lit = (groups['亮窗层'] ??= { count: 0, ms: 0, pixels: 0 });
            lit.count += 1;
            lit.pixels += glow.w * glow.h;
          }
        }
        const bakeMs = performance.now() - started;
        const height = pack(sprites);
        return {
          ...draw(sprites, height),
          stats: {
            count: keys.length,
            frames: sprites.length,
            bakeMs,
            groups,
            width: ATLAS_WIDTH,
            height,
          },
        };
      };

      window.bakerReady = true;
    </script>
  </body>
</html>
